<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Preview</title>
    <!-- highlight.js 11.11.1 - 代码高亮样式 -->
    <link type="text/css" href="../_/css/lib/default.min.css" rel="stylesheet" media="all" />
    <!-- katex 0.16.28 - 数学公式样式 -->
    <link type="text/css" href="../_/css/lib/katex.min.css" rel="stylesheet" media="all" />
    <link type="text/css" href="css/previm.css" rel="stylesheet" />
    <!-- markdown-it-texmath 1.0.0 - 数学公式插件样式 -->
    <link type="text/css" href="../_/css/lib/texmath.min.css" rel="stylesheet" media="all" />
    <style>
        /* Fix #43 */
        .section,
        .section0,
        .section1,
        .section2,
        .section3 {
            opacity: unset;
        }
    </style>
</head>
<body id="body">
    <div id="header">
        <span id="markdown-file-name">Loading...</span>
        <small><span id="last-modified"></span></small>
    </div>
    <div id="preview"></div>
    <div id="footer">
        <!-- markdown-it 14.1.1 - Markdown 解析器 -->
        <script src="../_/js/lib/markdown-it.min.js"></script>
        <!-- markdown-it 插件 -->
        <script src="../_/js/lib/markdown-it-abbr.min.js"></script>
        <script src="../_/js/lib/markdown-it-deflist.min.js"></script>
        <script src="../_/js/lib/markdown-it-footnote.min.js"></script>
        <script src="../_/js/lib/markdown-it-sub.min.js"></script>
        <script src="../_/js/lib/markdown-it-sup.min.js"></script>
        <script src="../_/js/lib/markdown-it-checkbox.min.js"></script>
        <script src="../_/js/lib/markdown-it-cjk-breaks.min.js"></script>
        <!-- katex 0.16.28 - 数学公式渲染 -->
        <script src="../_/js/lib/katex.min.js"></script>
        <!-- markdown-it-texmath 1.0.0 - 数学公式插件 -->
        <script src="../_/js/lib/texmath.min.js"></script>
        <!-- highlight.js 11.11.1 - 代码高亮 -->
        <script src="../_/js/lib/highlight.min.js"></script>
        <!-- mermaid 11.12.2 - 流程图支持 -->
        <script src="../_/js/lib/mermaid.min.js"></script>
        <!-- PlantUML 支持 -->
        <script src="../_/js/lib/zip_deflate.js"></script>
        <script src="../_/js/lib/plantuml.js"></script>
        <!-- previm 主脚本 -->
        <script src="../_/js/previm.js"></script>
        <div id="monitor"></div>
    </div>
</body>
</html>
